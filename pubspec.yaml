name: tasky
description: "Tasky - a simple, focused to-do app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & value types
  provider: ^6.1.5+1
  equatable: ^2.1.0
  uuid: ^4.6.0

  # Storage & files
  sqflite: ^2.4.2+1
  shared_preferences: ^2.5.5
  path: ^1.9.1
  path_provider: ^2.1.5
  image_picker: ^1.2.2

  # UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  smooth_page_indicator: ^3.0.0

  # Utilities
  intl: ^0.20.2
  characters: ^1.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
